name: Tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .

  linux:
    # No tkinter or display here, so only the platform-neutral and Linux modules run (as in WSL).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: >
          python -m unittest
          tests.test_linux tests.test_config tests.test_engine
          tests.test_i18n tests.test_theme tests.test_uninstall
